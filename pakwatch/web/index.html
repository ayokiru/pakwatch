<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pakwatch</title>
<style>
:root {
  color-scheme: light dark;
  --window: #f5f5f7; --group: #ffffff; --sidebar: rgba(236, 236, 240, .72); --toolbar: rgba(245, 245, 247, .72);
  --label: #1d1d1f; --secondary: rgba(60, 60, 67, .72); --tertiary: rgba(60, 60, 67, .45);
  --separator: rgba(60, 60, 67, .16); --fill: rgba(120, 120, 128, .12); --fill-hover: rgba(120, 120, 128, .18);
  --accent: #007aff; --accent-soft: rgba(0, 122, 255, .12);
  --green: #28a745; --orange: #e07800; --red: #e0352b; --gray: #8e8e93; --blue: #007aff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 0 0 .5px rgba(0, 0, 0, .06);
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --ease: cubic-bezier(.32, .72, 0, 1);  /* critically damped feel: fast start, no overshoot */
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #161618; --group: #232325; --sidebar: rgba(30, 30, 33, .7); --toolbar: rgba(22, 22, 24, .72);
    --label: #f5f5f7; --secondary: rgba(235, 235, 245, .62); --tertiary: rgba(235, 235, 245, .36);
    --separator: rgba(84, 84, 88, .55); --fill: rgba(120, 120, 128, .2); --fill-hover: rgba(120, 120, 128, .3);
    --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, .2);
    --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --gray: #98989d; --blue: #0a84ff;
    --shadow: 0 0 0 .5px rgba(255, 255, 255, .06);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--window); color: var(--label); font: 0.875rem/1.45 var(--text); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; box-shadow: 0 0 0 1px var(--accent); border-radius: 8px; }
svg { flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-columns: 15.5rem 1fr; height: 100%; }

/* sidebar: the heavier material, a source list */
.sidebar { background: var(--sidebar); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-right: .5px solid var(--separator); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: .5rem; padding: 1.1rem 1rem .9rem; font: 600 .95rem var(--display); letter-spacing: -.01em; }
.brand svg { width: 20px; height: 20px; color: var(--accent); }
.list-title { padding: .4rem 1rem .3rem; font-size: .69rem; font-weight: 600; color: var(--tertiary); letter-spacing: .02em; }
.games { padding: 0 .5rem; overflow: auto; flex: 1; }
.game { display: flex; align-items: center; gap: .6rem; width: 100%; padding: .4rem .5rem; border: 0; border-radius: 8px;
  background: none; text-align: left; cursor: default; transition: background-color .12s; }
.game:hover { background: var(--fill); }
.game:active { background: var(--fill-hover); }
.game[aria-current="true"] { background: var(--accent-soft); }
.tile { width: 1.75rem; height: 1.75rem; border-radius: 7px; display: grid; place-items: center; color: #fff; font: 600 .72rem var(--display);
  letter-spacing: .01em; box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .25), 0 1px 2px rgba(0, 0, 0, .15); }
.game .n { font-weight: 500; line-height: 1.2; }
.game .s { font-size: .75rem; color: var(--secondary); }
.side-note { padding: .5rem 1rem; color: var(--secondary); font-size: .8rem; }
.other { padding: .8rem 1rem 1rem; border-top: .5px solid var(--separator); }
.other label { display: block; font-size: .75rem; color: var(--secondary); margin-bottom: .35rem; }
.field { display: flex; align-items: center; background: var(--group); border-radius: 7px; box-shadow: var(--shadow); }
.field input { flex: 1; min-width: 0; border: 0; background: none; padding: .42rem .55rem; font: .78rem var(--mono); outline: none; }
.field button { border: 0; background: none; color: var(--accent); font-weight: 500; padding: .42rem .6rem; cursor: default; border-radius: 7px; }
.field button:active { opacity: .6; }
.field:focus-within { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }

/* content with a translucent toolbar that it scrolls under */
.content { position: relative; overflow: auto; min-height: 0; }
.toolbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: .75rem; padding: .7rem 1.6rem; min-height: 3.2rem;
  background: var(--toolbar); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 .5px 0 transparent; transition: box-shadow .2s; }
.content.scrolled .toolbar { box-shadow: 0 .5px 0 var(--separator); }
.toolbar .t { font: 600 .9rem var(--display); opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .3s var(--ease); }
.content.scrolled .toolbar .t { opacity: 1; transform: none; }
.toolbar .spacer { flex: 1; }
.tb-btn { display: inline-flex; align-items: center; gap: .4rem; border: 0; border-radius: 7px; padding: .38rem .7rem; background: var(--fill);
  font-weight: 500; cursor: default; transition: background-color .12s, transform .1s ease-out; }
.tb-btn:hover { background: var(--fill-hover); }
.tb-btn:active { transform: scale(.97); }
.tb-btn svg { width: 15px; height: 15px; }
.tb-btn.done { color: var(--green); }
.tb-btn[aria-busy="true"] svg { animation: spin 1s linear infinite; }

.page { max-width: 54rem; margin: 0 auto; padding: .4rem 1.6rem 3rem; }
.hero { display: flex; gap: 1rem; align-items: flex-start; margin: .6rem 0 1.8rem; }
.symbol { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.symbol svg { width: 1.35rem; height: 1.35rem; }
.symbol.sm { width: 1.6rem; height: 1.6rem; }
.symbol.sm svg { width: .95rem; height: .95rem; }
.green { background: var(--green); } .orange { background: var(--orange); } .red { background: var(--red); } .gray { background: var(--gray); } .blue { background: var(--blue); }
.hero h1 { margin: 0; font: 600 1.75rem/1.12 var(--display); letter-spacing: -.022em; }
.hero p { margin: .35rem 0 0; color: var(--secondary); font-size: .95rem; max-width: 40rem; }
.facts { margin-top: .55rem; color: var(--tertiary); font-size: .8rem; }
.facts span + span::before { content: "·"; margin: 0 .45rem; }

.section { margin-bottom: 1.6rem; }
.section h2 { margin: 0 0 .4rem .9rem; font: 600 .78rem var(--text); color: var(--secondary); }
.section .foot { margin: .4rem .9rem 0; font-size: .75rem; color: var(--tertiary); }
.group { background: var(--group); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.item { position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 3.3rem; right: 0; border-top: .5px solid var(--separator); }
.row { display: flex; align-items: center; gap: .8rem; width: 100%; padding: .65rem .9rem; border: 0; background: none; text-align: left;
  cursor: default; transition: background-color .12s; min-height: 3.3rem; }
button.row:hover { background: var(--fill); }
button.row:active { background: var(--fill-hover); }
.row .main { flex: 1; min-width: 0; }
.row .name { font-weight: 500; word-break: break-all; }
.row .sub { color: var(--secondary); font-size: .8rem; }
.row .chev { width: 13px; height: 13px; color: var(--tertiary); transition: transform .35s var(--ease); }
.row[aria-expanded="true"] .chev { transform: rotate(90deg); }

/* disclosure: grid rows animate from the current height, so a second click mid-way reverses smoothly */
.reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.reveal.open { grid-template-rows: 1fr; }
.reveal > .inner { overflow: hidden; min-height: 0; }
.detail { padding: .1rem .9rem .9rem 3.3rem; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .4s var(--ease); }
.reveal.open .detail { opacity: 1; transform: none; }
.detail h3 { margin: .55rem 0 .25rem; font: 600 .72rem var(--text); color: var(--tertiary); }
.paths { list-style: none; margin: 0; padding: 0; font: .75rem/1.75 var(--mono); color: var(--secondary); max-height: 18rem; overflow: auto; }
.paths li { word-break: break-all; }
.paths .hit { color: var(--label); }
.paths .what { display: inline-block; width: 4.6rem; font: 600 .7rem var(--text); color: var(--orange); }
.where { margin-top: .5rem; font-size: .75rem; color: var(--tertiary); }

.conflict .row { align-items: flex-start; }
.actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .6rem; }
.actions .where { margin: 0; }
.tb-btn:disabled { opacity: .5; }
.alert { display: flex; align-items: center; gap: .6rem; margin: .4rem 0 1rem; padding: .6rem .9rem; border-radius: 10px;
  background: var(--group); box-shadow: var(--shadow); }
.path { font: .78rem var(--mono); word-break: break-all; }

.empty { text-align: center; padding: 5rem 1rem; color: var(--secondary); }
.empty h1 { font: 600 1.3rem var(--display); letter-spacing: -.015em; color: var(--label); margin: .8rem 0 .3rem; }
.empty .symbol { margin: 0 auto; }
.spinner { width: 1.4rem; height: 1.4rem; margin: 0 auto; border-radius: 50%; border: 2px solid var(--fill-hover); border-top-color: var(--secondary);
  animation: spin .9s linear infinite; }
.fade-in { animation: rise .45s var(--ease) both; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
  .reveal { transition: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .sidebar, .toolbar { backdrop-filter: none; -webkit-backdrop-filter: none; }
  .sidebar { background: #ececf0; } .toolbar { background: var(--window); }
  @media (prefers-color-scheme: dark) { .sidebar { background: #1e1e21; } }
}
@media (prefers-contrast: more) {
  :root { --separator: rgba(0, 0, 0, .5); --secondary: rgba(0, 0, 0, .85); }
  @media (prefers-color-scheme: dark) { :root { --separator: rgba(255, 255, 255, .55); --secondary: rgba(255, 255, 255, .9); } }
  .group, .field { box-shadow: 0 0 0 1px var(--separator); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .sidebar { border-right: 0; border-bottom: .5px solid var(--separator); }
  .content { overflow: visible; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="Games">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg>pakwatch</div>
    <div class="list-title" id="games-title">Steam</div>
    <div class="games" id="games" aria-labelledby="games-title"><div class="side-note">Looking for games...</div></div>
    <form class="other" id="other">
      <label for="folder">Another game folder</label>
      <div class="field"><input id="folder" placeholder="D:\Games\MyGame" spellcheck="false" autocomplete="off"><button type="submit">Check</button></div>
    </form>
  </nav>
  <div class="content" id="content">
    <div class="toolbar">
      <span class="t" id="tb-title" aria-hidden="true"></span>
      <span class="spacer"></span>
      <span class="sr-only" id="copy-status" aria-live="polite"></span>
      <button class="tb-btn" id="copy" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>Copy Report</span></button>
      <button class="tb-btn" id="again" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Check Again</button>
    </div>
    <main class="page" id="report" aria-live="polite"></main>
  </div>
</div>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const PATHS = {  // symbol shapes, our own constants
  check: '<path d="M5 12.5 10 17l9-10"/>',
  warn: '<path d="M12 7v6"/><path d="M12 17h.01"/>',
  arrow: '<path d="M12 19V6"/><path d="m6 11 6-6 6 6"/>',
  plus: '<path d="M12 6v12"/><path d="M6 12h12"/>',
  info: '<path d="M12 11v6"/><path d="M12 7h.01"/>',
  pair: '<path d="M8 7h8"/><path d="M8 12h8"/><path d="M8 17h5"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  power: '<path d="M12 4v7"/><path d="M7.5 7a7 7 0 1 0 9 0"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
};
const KIND = {
  "patch touched": { color: "orange", sym: "warn", section: "Needs a look" },
  "uses changed": { color: "orange", sym: "link", section: "Uses changed game files" },
  "updated after patch": { color: "blue", sym: "arrow", section: "Updated by their authors" },
  "ok": { color: "green", sym: "check", section: "Fine" },
  "adds only": { color: "gray", sym: "plus", section: "Only add files" },
};
const ORDER = ["patch touched", "uses changed", "updated after patch", "ok", "adds only"];

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
  return e;
}
function svg(name, width = 2.2) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": width,
    "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);
  s.innerHTML = PATHS[name];
  return s;
}
const symbol = (color, name, small) => el("span", { class: `symbol ${color}${small ? " sm" : ""}` }, svg(name, small ? 2.6 : 2.4));
const num = (n) => n.toLocaleString("en-US");
const count = (n, word, many) => `${num(n)} ${n === 1 ? word : many || word + "s"}`;
const when = (iso) => new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function tileColor(name) {  // a stable hue per game, like an app icon
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `linear-gradient(160deg, hsl(${h} 62% 58%), hsl(${(h + 25) % 360} 58% 42%))`;
}
const initials = (name) => name.split(/[\s:_-]+/)  // "The Elder Scrolls IV: ..." -> ES, not TE
  .filter((w) => /^[A-Za-z0-9]/.test(w) && !/^(the|of|a|an|[ivx]+)$/i.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "?";

async function api(path, method = "GET") {
  const r = await fetch(path, { method, headers: { "X-Pakwatch-Token": TOKEN } });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
setInterval(() => api("/api/ping").catch(() => {}), 5000);

const content = document.getElementById("content");
content.addEventListener("scroll", () => content.classList.toggle("scrolled", content.scrollTop > 40), { passive: true });

let current = null;
async function loadGames() {
  const box = document.getElementById("games");
  let games;
  try { games = await api("/api/games"); }
  catch (e) { box.replaceChildren(el("div", { class: "side-note" }, "Couldn't read Steam: " + e.message)); return showStart(false); }
  if (!games.length) {
    box.replaceChildren(el("div", { class: "side-note" }, "No Unreal Engine games found in Steam."));
    return showStart(false);
  }
  box.replaceChildren(...games.map((g) => el("button", { class: "game", type: "button", "data-folder": g.folder, onclick: () => check(g.folder, g.name) },
    el("span", { class: "tile", style: `background:${tileColor(g.name)}`, "aria-hidden": "true" }, initials(g.name)),
    el("span", {}, el("div", { class: "n" }, g.name), el("div", { class: "s" }, g.mods ? count(g.mods, "mod") : "No mods")))));
  check(games[0].folder, games[0].name);
}

function showStart(hasGames) {
  document.getElementById("report").replaceChildren(el("div", { class: "empty fade-in" }, symbol("gray", "info"),
    el("h1", {}, hasGames ? "Pick a game" : "Point pakwatch at a game"),
    el("p", {}, "Enter the folder of an Unreal Engine 5 game on the left.")));
}

async function check(folder, name) {
  current = folder;
  for (const b of document.querySelectorAll(".game")) b.setAttribute("aria-current", String(b.dataset.folder === folder));
  const main = document.getElementById("report"), again = document.getElementById("again");
  main.setAttribute("aria-busy", "true");
  again.setAttribute("aria-busy", "true");
  if (!main.querySelector(".hero")) main.replaceChildren(el("div", { class: "empty" }, el("div", { class: "spinner" }), el("p", {}, "Reading the game's files...")));
  try {
    const r = await api("/api/scan?folder=" + encodeURIComponent(folder));
    if (current === folder) render(r, name || folder);
  } catch (e) {
    if (current === folder) main.replaceChildren(el("div", { class: "empty fade-in" }, symbol("red", "warn"), el("h1", {}, "Couldn't read this folder"), el("p", {}, e.message)));
  } finally {
    main.removeAttribute("aria-busy");
    again.removeAttribute("aria-busy");
  }
}

function verdict(r, name) {
  const need = r.mods.filter((m) => m.status === "patch touched").length;
  const uses = r.mods.filter((m) => m.status === "uses changed").length;
  const also = need && uses ? ` ${count(uses, "other mod uses", "other mods use")} game files it changed.` : "";
  const clash = r.conflicts.length ? ` ${count(r.conflicts.length, "file is", "files are")} replaced by more than one mod.` : "";
  if (r.first) return ["blue", "info", `pakwatch now knows this version of ${name}`,
    "Open it again after the next game update to see which of your mods the update touched." + clash];
  if (r.patched && need) return ["orange", "warn", `${count(need, "mod needs", "mods need")} a look`,
    `${name} updated after ${when(r.snapshot)}, and the update changed files ${need === 1 ? "this mod replaces" : "these mods replace"}.` + also + clash];
  if (r.patched && uses) return ["orange", "link", `${count(uses, "mod uses", "mods use")} changed game files`,
    `${name} updated after ${when(r.snapshot)}. ${uses === 1 ? "This mod replaces nothing that changed, but its own files use" : "These mods replace nothing that changed, but their own files use"} game files the update changed.` + clash];
  if (r.patched) return ["green", "check", "Your mods look fine after the update",
    `${name} updated after ${when(r.snapshot)}, but none of the files your mods replace changed.` + clash];
  return ["green", "check", `No game update since ${when(r.since)}`,
    "pakwatch compares your mods with the game again after its next update." + clash];
}

function render(r, name) {
  const main = document.getElementById("report");
  const [color, sym, title, text] = verdict(r, name);
  document.getElementById("tb-title").textContent = name;
  const side = [...document.querySelectorAll(".game")].find((b) => b.dataset.folder === current);
  if (side) side.querySelector(".s").textContent = r.mods.length ? count(r.mods.length, "mod") : "No mods";  // after a mod was turned off
  const again = document.getElementById("again");
  again.hidden = false;
  again.onclick = () => check(current, name);
  const copy = document.getElementById("copy");
  copy.hidden = false;
  copy.onclick = () => copyReport(copy, r.markdown);
  const u = r.update;
  const facts = el("div", { class: "facts" }, el("span", {}, count(r.game_files, "game file")), el("span", {}, count(r.mods.length, "mod")),
    r.patched ? el("span", {}, "the update " + [["changed", u.changed], ["added", u.added], ["removed", u.removed]]
      .filter(([, n]) => n).map(([w, n], i) => `${w} ${i ? num(n) : count(n, "file")}`).join(", ")) : null,
    r.patched && u.build_before && u.build && u.build_before !== u.build ? el("span", {}, `build ${u.build_before} → ${u.build}`) : null,
    !r.patched && u.build ? el("span", {}, `build ${u.build}`) : null,
    el("span", { class: "path" }, r.paks));
  const parts = [el("header", { class: "hero" }, symbol(color, sym), el("div", {}, el("h1", {}, title), el("p", {}, text), facts))];
  if (!r.mods.length) parts.push(section("Mods", [], "No mods found. pakwatch counts *_P containers and anything in a subfolder of Paks, such as ~mods."));
  for (const status of ORDER) {
    const list = r.mods.filter((m) => m.status === status);
    if (list.length) parts.push(section(KIND[status].section, list.map(modItem)));
  }
  if (r.disabled.length) parts.push(section("Turned off", r.disabled.map(offItem),
    "pakwatch keeps these outside the game, so it doesn't load them. Turn one on to put it back where it was."));
  if (r.unreadable.length) parts.push(section("Couldn't read", r.unreadable.map((m) => el("div", { class: "item" },
    el("div", { class: "row" }, symbol("gray", "info", true), el("span", { class: "main" }, el("div", { class: "name" }, m.name),
      el("div", { class: "sub" }, m.why))))), "pakwatch skips these mods, so the report says nothing about them."));
  if (r.conflicts.length) parts.push(section("Replaced by more than one mod", r.conflicts.map(conflictItem),
    "The game loads one version of each file, so the other mods lose that part."));
  main.replaceChildren(...parts);
  main.classList.remove("fade-in"); void main.offsetWidth; main.classList.add("fade-in");
}

async function copyReport(button, text) {
  try {  // writeText can hang without settling (no user gesture, unfocused tab), so it gets a second
    await Promise.race([navigator.clipboard.writeText(text), new Promise((_, no) => setTimeout(() => no(new Error("clipboard timeout")), 1000))]);
  }
  catch {  // older browsers, a denied permission, or the timeout above
    const t = el("textarea", { style: "position:fixed;opacity:0" }); t.value = text;
    document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }
  const label = button.querySelector("span");
  label.textContent = "Copied";
  document.getElementById("copy-status").textContent = "Report copied to the clipboard";
  button.classList.add("done");
  clearTimeout(button.timer);
  button.timer = setTimeout(() => { label.textContent = "Copy Report"; button.classList.remove("done"); }, 1600);
}

function section(title, items, foot) {
  return el("section", { class: "section" }, el("h2", {}, title), items.length ? el("div", { class: "group" }, items) : null,
    foot ? el("p", { class: "foot" }, foot) : null);
}

let uid = 0;
function disclosure(rowKids, detailKids) {
  const id = "d" + ++uid;
  const reveal = el("div", { class: "reveal", id, role: "region" }, el("div", { class: "inner" }, el("div", { class: "detail" }, detailKids)));
  const chev = svg("chev", 2.4);
  chev.setAttribute("class", "chev");
  const row = el("button", { class: "row", type: "button", "aria-expanded": "false", "aria-controls": id }, rowKids, chev);
  row.addEventListener("click", () => {
    const open = row.getAttribute("aria-expanded") !== "true";
    row.setAttribute("aria-expanded", String(open));
    reveal.classList.toggle("open", open);
  });
  return el("div", { class: "item" }, row, reveal);
}

function modItem(m) {
  const k = KIND[m.status];
  let sub;
  const t = m.touched.length;
  if (m.status === "patch touched") sub = t < m.replaced ? `The update changed ${num(t)} of the ${count(m.replaced, "game file")} it replaces`
    : t === 1 ? "The update changed the game file it replaces"
    : `The update changed ${t === 2 ? "both" : "all " + num(t)} game files it replaces`;
  else if (m.status === "uses changed") sub = m.uses.length === 1 ? "Its own files use a game file the update changed"
    : `Its own files use ${num(m.uses.length)} game files the update changed`;
  else if (m.status === "updated after patch") sub = (m.replaced ? `Replaces ${count(m.replaced, "game file")} and was` : "It was") + " updated after the game";
  else if (m.status === "adds only") sub = `Adds ${count(m.added, "file")} of its own`;
  else sub = `Replaces ${count(m.replaced, "game file")}` + (m.added ? `, adds ${num(m.added)} of its own` : "");
  const detail = [];
  if (m.touched.length) detail.push(el("h3", {}, "Changed by the update"),
    el("ul", { class: "paths" }, m.touched.map((f) => el("li", { class: "hit" }, el("span", { class: "what" }, f.what === "changed" ? "Changed" : "Removed"), f.path))));
  if (m.uses.length) detail.push(el("h3", {}, "Game files it uses that the update changed"),
    el("ul", { class: "paths" }, m.uses.map((f) => el("li", { class: "hit" }, el("span", { class: "what" }, f.what === "changed" ? "Changed" : "Removed"), f.path))));
  if (m.imports_note) detail.push(el("p", { class: "where" }, `pakwatch couldn't read which game files this mod uses: ${m.imports_note}.`));
  if (m.files.length) {
    const shown = m.files.slice(0, 300);
    detail.push(el("h3", {}, "Game files it replaces"), el("ul", { class: "paths" }, shown.map((f) => el("li", {}, f)),
      m.files.length > shown.length ? el("li", {}, `and ${num(m.files.length - shown.length)} more`) : null));
  } else {
    detail.push(el("p", { class: "where" }, "It only adds files of its own, so a game update can't change anything it replaces."));
  }
  detail.push(el("div", { class: "actions" }, el("span", { class: "where" }, `In ${m.where}`),
    el("button", { class: "tb-btn", type: "button", onclick: (e) => toggleMod(e.currentTarget, m.name, "off") }, svg("power", 2), "Turn Off")));
  return disclosure([symbol(k.color, k.sym, true), el("span", { class: "main" }, el("div", { class: "name" }, m.name), el("div", { class: "sub" }, sub))], detail);
}

function offItem(m) {
  return el("div", { class: "item" }, el("div", { class: "row" }, symbol("gray", "power", true),
    el("span", { class: "main" }, el("div", { class: "name" }, m.name), el("div", { class: "sub" }, `Off, returns to ${m.where}`)),
    el("button", { class: "tb-btn", type: "button", onclick: (e) => toggleMod(e.currentTarget, m.name, "on") }, "Turn On")));
}

async function toggleMod(button, name, action) {
  button.disabled = true;
  button.setAttribute("aria-busy", "true");
  try {
    await api(`/api/mod?folder=${encodeURIComponent(current)}&name=${encodeURIComponent(name)}&action=${action}`, "POST");
    document.getElementById("copy-status").textContent = `${name} turned ${action}`;
    await check(current, document.getElementById("tb-title").textContent);
  } catch (e) {
    button.disabled = false;
    button.removeAttribute("aria-busy");
    alertBar(e.message);
  }
}

function alertBar(text) {  // a message under the toolbar, not a modal dialog
  const bar = el("div", { class: "alert fade-in", role: "alert" }, symbol("orange", "warn", true), el("span", {}, text));
  document.querySelector(".alert")?.remove();
  document.getElementById("report").prepend(bar);
  setTimeout(() => bar.remove(), 6000);
}

function conflictItem(c) {
  return el("div", { class: "item conflict" }, el("div", { class: "row" }, symbol("orange", "pair", true),
    el("span", { class: "main" }, el("div", { class: "path" }, c.path), el("div", { class: "sub" }, new Intl.ListFormat("en").format(c.mods)))));
}

document.getElementById("other").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = document.getElementById("folder").value.trim();
  if (v) check(v, v.split(/[\\/]/).filter(Boolean).pop());
});
showStart(true);
loadGames();
</script>
</body>
